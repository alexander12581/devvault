[package]
name = "devvault"
version = "0.1.0"
edition = "2021"
description = "Developer secrets & .env manager - cross-project environment variable management with security scanning"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/devvault"
keywords = ["secrets", "env", "security", "cli", "developer-tools"]
categories = ["command-line-utilities", "security"]
readme = "README.md"

[lib]
name = "devvault"
path = "src/lib.rs"

[[bin]]
name = "devvault"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }

# Cryptography
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Pattern matching and scanning
regex = "1"
walkdir = "2"

# Git integration
git2 = "0.18"

# Encoding
base64 = "0.21"

# Error handling
anyhow = "1"
thiserror = "1"

# Terminal output
colored = "2"
indicatif = "0.17"

# Security
zeroize = { version = "1", features = ["derive"] }

# Parallelism
rayon = "1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true